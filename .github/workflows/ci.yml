name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 -m py_compile agent.py app.py
      - run: python3 agent.py --input leads_sample.csv --output /tmp/scored_test.csv && test -s /tmp/scored_test.csv
      - run: docker build -t lead-qualification-agent .